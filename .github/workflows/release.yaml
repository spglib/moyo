on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  crates-io:
    if: startsWith(github.ref, 'refs/tags/') && vars.TAGPR_APP_CLIENT_ID != ''
    name: Publish moyo to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Check crate version and registry
        id: crate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          crate_version=$(cargo pkgid --locked -p moyo | sed 's/.*[#@]//')
          test "$crate_version" = "$version"
          published=$(curl --fail --silent --show-error --retry 3 https://index.crates.io/mo/yo/moyo |
            jq -s --arg version "$version" 'any(.[]; .vers == $version)')
          echo "published=$published" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io-auth
        if: steps.crate.outputs.published == 'false'
      - run: cargo publish --locked -p moyo
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  gh-release:
    if: "startsWith(github.ref, 'refs/tags/')"
    name: Create release
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: moyo ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, 'rc') }}
          generate_release_notes: true

  python:
    name: Python Release
    uses: ./.github/workflows/rw-python-release.yaml
    secrets: inherit
    with:
      # PyPI Trusted Publishing must run in this top-level workflow.
      dry_run: true

  python-publish:
    if: "startsWith(github.ref, 'refs/tags/')"
    name: Python Publish
    runs-on: ubuntu-latest
    needs: [python]
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: pypi-*
          merge-multiple: true
          path: dist
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
          verbose: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: false
          verbose: true

  c:
    name: C Release
    uses: ./.github/workflows/rw-c-release.yaml
    with:
      dry_run: ${{ ! startsWith(github.ref, 'refs/tags/') }}

  wasm:
    name: WASM Release
    uses: ./.github/workflows/rw-wasm-release.yaml
    secrets: inherit
    with:
      dry_run: ${{ ! startsWith(github.ref, 'refs/tags/') }}
