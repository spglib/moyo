on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  gh-release:
    if: "startsWith(github.ref, 'refs/tags/')"
    name: Create release
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: moyo ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, 'rc') }}
          generate_release_notes: true

  python:
    name: Python Release
    uses: ./.github/workflows/rw-python-release.yaml
    secrets: inherit
    with:
      # PyPI Trusted Publishing must run in this top-level workflow.
      dry_run: true

  python-publish:
    if: "startsWith(github.ref, 'refs/tags/')"
    name: Python Publish
    runs-on: ubuntu-latest
    needs: [python]
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pypi-*
          merge-multiple: true
          path: dist
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
          verbose: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: false
          verbose: true

  c:
    name: C Release
    uses: ./.github/workflows/rw-c-release.yaml
    with:
      dry_run: ${{ ! startsWith(github.ref, 'refs/tags/') }}

  wasm:
    name: WASM Release
    uses: ./.github/workflows/rw-wasm-release.yaml
    secrets: inherit
    with:
      dry_run: ${{ ! startsWith(github.ref, 'refs/tags/') }}
