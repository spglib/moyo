name: Check

on:
  push:
    branches: [main]
  # No branch filter: also run for stacked pull requests that target a
  # feature branch instead of main
  pull_request:
  workflow_dispatch:

jobs:
  prek:
    runs-on: ubuntu-latest  # ubuntu-slim lacks cargo
    env:
      SKIP: cbindgen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'
    - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2
      with:
        extra_args: --all-files

  cargo-deny:
    runs-on: ubuntu-latest  # ubuntu-slim lacks docker
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      with:
        rust-version: 1.85.0  # edition 2024

  pass:
    name: ✅ Pass checks
    needs: [prek, cargo-deny]
    runs-on: ubuntu-latest # ubuntu-slim lacks python
    steps:
      - name: Check all CI jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
    if: always()
