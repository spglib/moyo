name: Check

on:
  push:
    branches: [main]
  # No branch filter: also run for stacked pull requests that target a
  # feature branch instead of main
  pull_request:
  workflow_dispatch:

jobs:
  prek:
    runs-on: ubuntu-latest  # ubuntu-slim lacks cargo
    env:
      SKIP: cbindgen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.13'
    - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2
      with:
        extra_args: --all-files

  cargo-deny:
    runs-on: ubuntu-latest  # ubuntu-slim lacks docker
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      with:
        rust-version: 1.85.0  # edition 2024

  release:
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'tagpr-from-v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
    - name: Verify the workspace version and lockfile
      run: |
        cargo metadata --locked --format-version 1 |
          jq -e --arg previous "${GITHUB_HEAD_REF#tagpr-from-v}" '
            .workspace_members as $members
            | [.packages[] | select(.id as $id | $members | index($id))] as $workspace
            | ($workspace[] | select(.name == "moyo") | .version) as $version
            | $version != $previous
              and all($workspace[]; .version == $version)
              and all($workspace[] | select(.name == "moyopy" or .name == "moyoc")
                      | .dependencies[] | select(.name == "moyo"); .req == ("^" + $version))
          '
      shell: bash
    - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
      with:
        tool: cargo-semver-checks@0.51.0
    - name: Check Rust API compatibility
      run: cargo semver-checks check-release -p moyo --baseline-rev "${GITHUB_HEAD_REF#tagpr-from-}"

  pass:
    name: ✅ Pass checks
    needs: [prek, cargo-deny, release]
    runs-on: ubuntu-latest # ubuntu-slim lacks python
    steps:
      - name: Check all CI jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: release
    if: always()
