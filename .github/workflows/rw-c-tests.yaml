name: C binding CI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # main
      - name: Install cbindgen
        run: cargo binstall cbindgen --locked --no-confirm --force
      - name: Configure
        run: cmake -S moyoc -B moyoc/build -DMOYOC_BUILD_FORTRAN=ON
      - name: Build
        run: cmake --build moyoc/build
      - name: Run tests
        run: ctest --test-dir moyoc/build --output-on-failure
