name: Python Release CI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, perform a dry run without releasing'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      dry_run:
        description: 'If true, perform a dry run without releasing'
        required: true
        type: boolean

env:
  PYTHON_VERSION: "3.13"

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: linux
            target: x86_64
            sccache: false
          - os: ubuntu-latest
            system: linux
            target: aarch64
            sccache: false
          - os: macos-latest
            system: darwin
            target: x86_64
            sccache: true
          - os: macos-latest
            system: darwin
            target: aarch64
            sccache: true
          - os: windows-latest
            system: windows
            target: x64
            sccache: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --manifest-path moyopy/Cargo.toml
          sccache: ${{ matrix.sccache }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pypi-${{ matrix.target }}-${{ matrix.system }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist --manifest-path moyopy/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pypi-sdist
          path: dist

  release:
    if: ${{ ! inputs.dry_run }}
    name: Release
    runs-on: ubuntu-latest
    needs: [wheel, sdist]
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: pypi-*
          merge-multiple: true
          path: dist
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
          verbose: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: false
          verbose: true
